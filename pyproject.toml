[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "remflow"
version = "0.1.0"
description = "Relational event models for ordered sender-receiver data in Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2.4",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.urls]
Repository = "https://github.com/damianfraszczak/REMFlow"
Documentation = "https://remflow.readthedocs.io/en/stable/"

[project.optional-dependencies]
gpu = ["jax>=0.4.30,<0.8"]
benchmark-cuda = ["cupy-cuda12x>=14"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]
docs = ["sphinx>=7,<9", "sphinx-rtd-theme>=3,<4", "myst-parser>=3,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/remflow"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/remflow",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "src",
]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
